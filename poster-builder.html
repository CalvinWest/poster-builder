<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}</style></head><body><title>Open Mic Poster Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: poster canvas on the left at full height, a narrow control rail on the right; stacks on phones */
:root{
  --bg:#120b1c; --panel:#1c1329; --line:#33264a; --fg:#f4ecfb; --muted:#b4a3c8; --accent:#ec3a7c; --accent-fg:#ffffff;
  --display:Anton, Impact, "Arial Narrow", sans-serif;
  --ui:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px}
.app{min-height:100%;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{flex:0 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
canvas{display:block;height:calc(100vh - 64px);max-height:1200px;min-height:420px;aspect-ratio:9/16;max-width:100%;border-radius:4px;touch-action:none;background:#160d22;box-shadow:0 0 0 1px var(--line)}
canvas:focus{outline:none}
canvas:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.stage .tip{font-size:12px;color:var(--muted);text-align:center;max-width:56ch}
.rail{flex:0 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
h2{margin:0;font-family:var(--ui);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button,.filebtn{font:600 14px var(--ui);letter-spacing:.04em;background:#2a1e3b;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:8px 11px;cursor:pointer;min-height:36px}
button:hover,.filebtn:hover{border-color:var(--muted)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-size:17px;padding:11px}
button.on{border-color:var(--accent);color:var(--accent)}
button:focus-visible,.filebtn:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filebtn{display:inline-flex;flex-direction:row;align-items:center;justify-content:center;position:relative;box-sizing:border-box;line-height:1.2}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input[type=text]{width:100%;box-sizing:border-box;font:500 16px var(--ui);letter-spacing:.04em;background:#120b1c;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input[type=range]{accent-color:var(--accent)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.addcol{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:6px;align-items:center}
.addcol input[type=color]{width:44px;height:36px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.check{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--fg)}
.check input{accent-color:var(--accent);width:18px;height:18px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:28px;height:28px;min-height:0;padding:0;border-radius:50%;border:2px solid transparent}
.sw{box-shadow:inset 0 0 0 1px rgba(244,236,251,.28)}
.sw.on{border-color:var(--fg)}
.sw.orig{background:linear-gradient(135deg,#f4ecfb 0 50%,#3a2b52 50% 100%)}
.note{font-size:12px;color:var(--muted);margin:0}
.status{font-size:13px;color:var(--fg);min-height:1.2em;margin:0;text-align:center;max-width:60ch}
.preview{position:fixed;inset:0;background:rgba(10,6,16,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));z-index:20}
.preview img{max-height:80vh;max-width:100%;border-radius:4px}
.menu{position:fixed;z-index:30;min-width:220px;background:#241a35;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 14px 36px rgba(0,0,0,.55)}
.menu button,.menu .filebtn{background:none;border:0;border-radius:6px;justify-content:flex-start;text-align:left;padding:8px 10px;min-height:36px;font-size:15px}
.menu button:hover,.menu .filebtn:hover,.menu button:focus-visible{background:#33264a;outline:none}
.menu button:disabled{background:none}
.msep{height:1px;background:var(--line);margin:4px 2px}
.mzoom{padding:4px 10px 6px;font-size:12px}
@media (max-width:760px){canvas{height:auto;width:100%;min-height:0}.rail{flex-basis:100%}}
</style>

<div class="app">
  <div class="stage">
    <canvas id="cv" width="1080" height="1920" tabindex="0" aria-label="Poster preview. Drop photos onto tiles, drag inside a photo to reframe it, drag the gaps to resize. Press Shift+F10 for tile options."></canvas>
    <p class="status" id="status" role="status"></p>
  </div>

  <div class="rail">
    <div class="box">
      <h2>Layout</h2>
      <div class="btns" id="presets">
        <button type="button" data-p="rows">Three rows</button>
        <button type="button" data-p="tallL">Tall left</button>
        <button type="button" data-p="tallR">Tall right</button>
        <button type="button" data-p="bigTop">Big top</button>
        <button type="button" data-p="one">One tile</button>
      </div>
      <div class="btns"><button id="clearAll" type="button">Empty all tiles</button></div>
      <label for="topM">Margin top<input id="topM" type="range" min="40" max="300" step="2" value="150"></label>
    </div>

    <div class="box">
      <h2>Text</h2>
      <label for="tName">Host<input id="tName" type="text" value="CALVIN WEST"></label>
      <div class="row2">
        <label for="tBig">Big word<input id="tBig" type="text" value="HOY"></label>
        <label for="tTime">Time<input id="tTime" type="text" value="21:30"></label>
      </div>
      <label for="tDay">Day<input id="tDay" type="text" value="MIÉRCOLES"></label>
      <label for="tAddr">Address<input id="tAddr" type="text" value="C/ JUAN DE HERRERA 40, ALICANTE"></label>
    </div>

    <div class="box" id="palHead">
      <h2>Headline</h2>
      <div class="swatches" role="group" aria-label="Headline colour"></div>
      <div class="addcol">
        <input type="color" aria-label="Pick a headline colour">
        <input type="text" maxlength="7" placeholder="#F4ECFB" aria-label="Headline hex code" spellcheck="false">
        <button type="button">Add</button>
      </div>
    </div>

    <div class="box" id="palAccent">
      <h2>Accent</h2>
      <div class="swatches" role="group" aria-label="Accent colour"></div>
      <div class="addcol">
        <input type="color" aria-label="Pick a accent colour">
        <input type="text" maxlength="7" placeholder="#EC3A7C" aria-label="Accent hex code" spellcheck="false">
        <button type="button">Add</button>
      </div>
    </div>

    <div class="box" id="palAccent2">
      <h2>Accent 2</h2>
      <div class="swatches" role="group" aria-label="Accent 2 colour"></div>
      <div class="addcol">
        <input type="color" aria-label="Pick a accent 2 colour">
        <input type="text" maxlength="7" placeholder="#CBB9DC" aria-label="Accent 2 hex code" spellcheck="false">
        <button type="button">Add</button>
      </div>
    </div>

    <div class="box" id="palBg">
      <h2>Background</h2>
      <div class="swatches" role="group" aria-label="Background colour"></div>
      <div class="addcol">
        <input type="color" aria-label="Pick a background colour">
        <input type="text" maxlength="7" placeholder="#160D22" aria-label="Background hex code" spellcheck="false">
        <button type="button">Add</button>
      </div>
    </div>

    <div class="box">
      <button class="primary" id="dl" type="button">Download PNG</button>
    </div>
  </div>
</div>

<div class="menu" id="menu" role="menu" aria-label="Tile options" hidden>
  <button role="menuitem" id="mMerge" type="button">Merge tiles</button>
  <button role="menuitem" id="mMergeWith" type="button">Merge with…</button>
  <div class="msep" role="separator"></div>
  <label class="filebtn" role="menuitem">Replace photo…<input id="replace" type="file" accept="image/*"></label>
  <button role="menuitem" id="clearOne" type="button">Remove photo</button>
  <button role="menuitem" id="swap" type="button">Swap with…</button>
  <div class="msep" role="separator"></div>
  <button role="menuitem" id="splitH" type="button">Split left / right</button>
  <button role="menuitem" id="splitV" type="button">Split top / bottom</button>
  <button role="menuitem" id="delTile" type="button">Delete tile</button>
</div>

<div class="menu" id="swMenu" role="menu" aria-label="Colour options" hidden>
  <button role="menuitem" id="swDel" type="button">Delete colour</button>
</div>

<div class="menu" id="logoMenu" role="menu" aria-label="Logo options" hidden>
  <label class="filebtn" role="menuitem">Replace logo…<input id="logoFile" type="file" accept="image/*"></label>
  <button role="menuitem" id="logoTint" type="button">Use original colours</button>
</div>

<div class="preview" id="preview" hidden>
  <img id="previewImg" alt="Finished poster">
  <p class="note">Downloading isn't available here. Press and hold (or right-click) the image to save it.</p>
  <button id="closePreview" type="button">Close</button>
</div>

  function remove(c){if(list.length<2){say(`Keep at least one ${P.label.toLowerCase()} colour.`);return}
    const i=list.indexOf(c);list=list.filter(x=>x!==c);if(cur===c)cur=list[Math.min(i,list.length-1)];render(cur)}
  function addHex(){const h=normHex(hex.value||pick.value);if(!h){say("Type a hex code like "+hex.placeholder+".");return}
    if(!list.includes(h))list.push(h);cur=h;say("");render()}
  sw.addEventListener("click",e=>{const b=e.target.closest(".sw");if(!b)return;cur=b.dataset.c;pick.value=cur;hex.value=cur.toUpperCase();render(cur)});
  sw.addEventListener("keydown",e=>{const b=e.target.closest(".sw");if(b&&(e.key==="Delete"||e.key==="Backspace")){e.preventDefault();remove(b.dataset.c)}});
  sw.addEventListener("contextmenu",e=>{const b=e.target.closest(".sw");if(!b)return;e.preventDefault();b.focus();swDelete=()=>remove(b.dataset.c);place($("swMenu"),e.clientX,e.clientY)});
  pick.value=cur;
  pick.addEventListener("input",()=>{hex.value=pick.value.toUpperCase()});
  hex.addEventListener("input",()=>{const h=normHex(hex.value);if(h)pick.value=h});
  hex.addEventListener("keydown",e=>{if(e.key==="Enter")addHex()});
  add.addEventListener("click",addHex);
  render();
}
let swDelete=null;
$("topM").addEventListener("input",draw);
$("logoFile").addEventListener("change",e=>{closeMenu();const f=e.target.files[0];if(f&&f.type.startsWith("image/"))setLogo(URL.createObjectURL(f));e.target.value=""});

/* ---------- export ---------- */
function say(t){$("status").textContent=t}
let downloads=null;
(async()=>{try{downloads=window.claude?await window.claude.use("downloads"):null}catch(e){downloads=null}})();
$("dl").addEventListener("click",async()=>{
  const off=document.createElement("canvas");off.width=W;off.height=H;render(off.getContext("2d"),false);
  const blob=await new Promise(r=>off.toBlob(r,"image/png"));
  const d=new Date(),name=`open-mic-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.png`;
  if(!window.claude){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();say("Saved.");return}
  if(downloads){try{await downloads.save({filename:name,data:blob});say("Saved.");return}
    catch(err){if(err&&err.code==="declined"){say("Download cancelled.");return}if(err&&err.code==="rate_limited"){say("A save prompt is already open.");return}}}
  $("previewImg").src=URL.createObjectURL(blob);$("preview").hidden=false;
});
$("closePreview").addEventListener("click",()=>{$("preview").hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("preview").hidden)$("preview").hidden=true;else if(swapFrom||mergeFrom){swapFrom=null;mergeFrom=null;say("");draw()}}});

$("swDel").addEventListener("click",()=>{if(swDelete)swDelete();swDelete=null});
$("logoTint").addEventListener("click",()=>{logoOrig=!logoOrig;store.set("om-logoorig",logoOrig);draw()});
["headline","accent","accent2","bg"].forEach(makePalette);

/* ---------- boot ---------- */
draw();
Promise.all(["250px Anton","600 56px 'Barlow Condensed'","400 56px 'Barlow Condensed'","500 30px 'Barlow Condensed'"].map(f=>document.fonts.load(f).catch(()=>null))).then(draw);
document.fonts.ready.then(draw);
